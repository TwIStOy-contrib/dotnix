name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "Justfile"
      - ".github/workflows/*"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "Justfile"
      - ".github/workflows/*"
  workflow_dispatch:

jobs:
  checks:
    name: Check expressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://nixos.org/nix/install
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
            # Auto-GC during builds: full-system builds on fresh channel revs
            # can otherwise fill the runner disk and fail with ENOSPC.
            min-free = 5368709120
            max-free = 16106127360
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run CI job
        run: just ci
  build:
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        host_name: [LCNDWWYVTFMFX, yukikaze, poi, taihou]
        include:
          - host_name: LCNDWWYVTFMFX
            os: macos-latest
          - host_name: yukikaze
            os: macos-latest
          - host_name: poi
            os: ubuntu-latest
          - host_name: taihou
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://nixos.org/nix/install
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
            # Auto-GC during builds: full-system builds on fresh channel revs
            # can otherwise fill the runner disk and fail with ENOSPC.
            min-free = 5368709120
            max-free = 16106127360
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Linux-specific command
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      # Retry once: fresh channel revs occasionally require source builds whose
      # check phases are flaky or runners run out of disk mid-build.
      - run: just ci-${{ matrix.host_name }} || just ci-${{ matrix.host_name }}
      - name: Push to Cachix
        uses: cachix/cachix-action@v17
        with:
          name: twistoy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(-source$|-nixed$|omnibus|requirements-txt|prefetch-npm-deps)'
